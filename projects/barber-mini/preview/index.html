<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>理发师接单小程序 · 界面预览（本地 mock）</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1 class="h1">理发师接单小程序 · 两端联动预览</h1>
  <p class="hint">左边＝顾客看到的；右边＝理发师（经营者）看到的。<b>同一份状态</b>：右边点「开始服务 / 完成本单」，左边那张卡立刻变。</p>
  <div id="err" class="err" hidden></div>
  <div class="wrap">
    <div class="col">
      <div class="phone">
        <div class="notch">顾客端 · 阿明理发</div>
        <div class="screen" id="screen-customer"></div>
      </div>
      <button class="demo-btn" data-act="demo">一键演示：顾客预约 → 理发师接单 → 完成</button>
    </div>
    <div class="col">
      <div class="phone">
        <div class="notch">经营者端 · 工作台</div>
        <div class="screen" id="screen-barber"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
