prompt = "巡检「开发→验收→开发」闭环。**每轮都很短**（别在对话里长篇）：能自动推进的就推进，没有可推进的事就**保持安静、不发任何消息**。\n\n按顺序做这三件：\n1) 合入闸：看 `outputs/merge/merge_request.json`。存在且 `ok=true` 且未合入 → 先复跑 `node scripts/crew_review_merge.mjs --check --repo <repo> --branch <branch> --task <task> [--tests \"<回归命令>\"] [--review <审阅记录路径>]`，仍全绿就走沙箱外小工的 `--apply` 合入；门禁挂了就贴出挂在哪一条。\n2) 待我处理的单：扫看板尾部与 `outputs/dialog/pending_codex-director.ndjson`，找 @codex-总监 的「待验收 / 待拍板 / 故障」，以及下属线（codex-套件 / 看板编辑 / 量化总监 / 唤醒通道 / dsh）声称\"已提交待验收\"或\"等下一单\"的条目；有未回的就处理，并在看板实名回一行（≤200 字）。\n3) 挂机的线：看 `outputs/crew_host_log.txt` 最近的 `doorbell-queue` 行与各线「已投递未唤醒」标注。若某条线**有未读留言但超过 10 分钟没产生新回合、没回板** → 直接用 `codex queue` 手工叫它一次（宿主可能还在跑旧通道），并记一行。\n\n判据：能自己闭环的自己闭环（派活 / 验收 / 合入 / 回板）；只有涉及下单、资金、策略参数、平台设置、给别人放权时才停下来问老板。"
